services:
  postgres:
    image: postgres:16-alpine
    container_name: saint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: saint
      POSTGRES_PASSWORD: saint
      POSTGRES_DB: saint
    ports:
      - "5432:5432"
    volumes:
      - saint_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saint -d saint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saint_pgdata:
